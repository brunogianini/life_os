name: Workflow para transformar tags recorrentes em áreas

on:
  push:

jobs:
  analise:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Analisar tags e criar áreas
        run: |
          echo "Analisando tags..."

          mkdir -p areas
          CREATED=0

          grep -RIn "#[A-Za-z0-9_-]\+" . \
            --exclude-dir={.git,node_modules,dist,vendor,.obsidian,areas} \
          | awk -F: '
              {
                file=$1
                while (match($0, /#[A-Za-z0-9_-]+/)) {
                  tag=substr($0, RSTART+1, RLENGTH-1)
                  key=file ":" tag
                  if (!seen[key]++) {
                    count[tag]++
                  }
                  $0=substr($0, RSTART+RLENGTH)
                }
              }
              END {
                for (t in count) {
                  if (count[t] > 5) {
                    print t
                  }
                }
              }
            ' \
          | while read -r tag; do
              FILE="areas/$tag.md"
              if [ ! -f "$FILE" ]; then
                echo "Criando área para tag '$tag'"
                echo "# Área: $tag" > "$FILE"
                echo "" >> "$FILE"
                echo "Criada automaticamente (tag presente em mais de 5 arquivos)." >> "$FILE"
                CREATED=1
              fi
            done

          echo "CREATED=$CREATED" >> $GITHUB_ENV

      - name: Commitar áreas criadas
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add areas/
          git commit -m "chore: criar áreas a partir de tags recorrentes"
          git push
